             <div class="sc-l pen">levante a caneta</div>
             <div class="sc-l mov">vá para <span class="sc-campo">posição aleatória</span></div>
             <div class="sc-l pen">use a caneta</div>
             <div class="sc-l ctrl">repita <span class="sc-campo">3</span> vezes</div>
             <div class="sc-l mov dentro">mova <span class="sc-campo">10</span> passos</div>
             <div class="sc-l mov dentro">gire <span class="sc-oval" style="background:#59C059;color:#12330F">360 / 3</span> graus</div>
           </div>
           <p>Sofia quer transformar esse triângulo em um hexágono colorido e precisa ajustar a repetição e o cálculo do ângulo. Qual alteração deve ser feita no código?</p>`,
         alts:["Repetir 3 vezes e girar 360 dividido por 6.","Repetir 6 vezes e girar 360 dividido por 6.",
               "Repetir 6 vezes e girar 360 graus.","Repetir 3 vezes e girar 360 graus."],
         certo:1,
         fbs:[
           "Pense na quantidade de lados do hexágono: repetir 3 vezes é suficiente para essa figura?",
           "Correto. O hexágono tem 6 lados: repete 6 vezes e gira 360 dividido por 6, e a forma fecha.",
           "Reveja o valor do giro: girar 360 graus a cada repetição impede a forma de ser construída.",
           "Olhe as duas coisas ao mesmo tempo: a quantidade de repetições e o ângulo do giro."
         ]},

        {tipo:"desafio", foco:false, card:"Hora do desafio",
         titulo:"Do triângulo para o quadrado",
         html:`<p>Nesta aula você montou o palco do mago e fez a varinha desenhar triângulos em posições sorteadas. O desafio é fazer ela desenhar outra forma.</p>
           <ol>
             <li>Altere o código para que a varinha desenhe um <b>quadrado perfeito</b>, no lugar do triângulo.</li>
             <li>Troque a cor da caneta por uma de sua preferência, que não seja o ciano.</li>
             <li>Use a lógica certa para o giro e para a quantidade de repetições do quadrado.</li>
           </ol>
           <div class="nota">Você pode fazer o desafio no seu próprio projeto ou num projeto em branco.</div>
           <div class="aviso">Quantos lados tem o quadrado? Esse número aparece em dois lugares do código.</div>`},

        {tipo:"placar", foco:true, card:"Placar da aula 01"}
      ]
    },
    {n:2, status:"espera", titulo:"aguardando o material da aula", semana:"semana a confirmar", telas:[]},
    {n:3, status:"espera", titulo:"aguardando o material da aula", semana:"semana a confirmar", telas:[]},
    {n:4, status:"espera", titulo:"aguardando o material da aula", semana:"semana a confirmar", telas:[]}
  ]
};

/* ========================= ESTADO ========================= */
const CHAVE = "facast6_u02_v0100";
let S = {nome:"", turma:"", aula:0, tela:-1, resp:{}, esc:{}, feitas:{}};
const palco = document.getElementById("palco");
const rbProx = document.getElementById("rbProx");
const rbVolta = document.getElementById("rbVolta");

function salvar(){
  try{ localStorage.setItem(CHAVE, JSON.stringify({nome:S.nome,turma:S.turma,resp:S.resp,esc:S.esc,feitas:S.feitas})); }
  catch(e){ /* navegador sem armazenamento · a aula continua normalmente */ }
}
function carregar(){
  try{
    const b = localStorage.getItem(CHAVE);
    if(!b) return;
    const d = JSON.parse(b);
    S.nome = d.nome||""; S.turma = d.turma||""; S.resp = d.resp||{}; S.esc = d.esc||{}; S.feitas = d.feitas||{};
  }catch(e){ /* sem armazenamento · comeca do zero */ }
}

/* ============ TELA CHEIA · entra no clique, sai sozinha ============ */
function ajustarFoco(quer){
  try{
    const dentro = !!document.fullscreenElement;
    if(quer && !dentro && document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen().catch(()=>{});
    }else if(!quer && dentro && document.exitFullscreen){
      document.exitFullscreen().catch(()=>{});
    }
  }catch(e){ /* iPhone e iPad nao aceitam tela cheia aqui · segue sem ela */ }
}

/* ========================= NAVEGACAO ========================= */
function telasDaAula(){ return CONT.aulas[S.aula-1] ? CONT.aulas[S.aula-1].telas : []; }

function irPara(aula, tela, querFoco){
  ajustarFoco(querFoco);
  S.aula = aula; S.tela = tela;
  desenhar();
}

function proxima(){
  const t = telasDaAula();
  if(S.tela < t.length-1){
    const nova = t[S.tela+1];
    irPara(S.aula, S.tela+1, !!nova.foco);
  }else{
    S.feitas["a"+S.aula] = true; salvar();
    irPara(0, -1, false);
  }
}
function voltar(){
  if(S.tela > 0){
    const nova = telasDaAula()[S.tela-1];
    irPara(S.aula, S.tela-1, !!nova.foco);
  }else{
    irPara(0, -1, false);
  }
}

/* ========================= DESENHO ========================= */
function chips(txt){
  document.getElementById("stVer").textContent = CONT.versao;
  document.getElementById("stNome").textContent = S.nome ? (S.nome+" · "+S.turma) : "sem identificação";
  document.getElementById("stTela").textContent = txt;
}

function desenhar(){
  window.scrollTo(0,0);
  if(!S.nome){ telaIdentificacao(); return; }
  if(S.aula === 0){ telaMapa(); return; }
  const t = telasDaAula()[S.tela];
  const total = telasDaAula().length;
  chips("aula "+S.aula+" · tela "+(S.tela+1)+" de "+total);
  rbVolta.disabled = false; rbProx.disabled = false;
  rbProx.textContent = (S.tela === total-1) ? "Voltar ao cronograma" : "Próximo";
  if(t.tipo==="objetivos") telaObjetivos(t);
  else if(t.tipo==="texto") telaTexto(t);
  else if(t.tipo==="passos") telaPassos(t);
  else if(t.tipo==="lacuna") telaLacuna(t);
  else if(t.tipo==="quiz") telaQuiz(t);
  else if(t.tipo==="desafio") telaTexto(t);
  else if(t.tipo==="placar") telaPlacar(t);
}

function telaIdentificacao(){
  chips("identificação");
  rbVolta.disabled = true; rbProx.disabled = true; rbProx.textContent = "Começar";
  palco.innerHTML = `
    <div class="card">
      <h1>Faça como eu fiz</h1>
      <h2>${CONT.ano} · ${CONT.unidade}</h2>
      <p>Escreva seu nome e escolha sua turma para começar.</p>
      <div class="campo"><label for="inNome">Seu nome</label><input id="inNome" type="text" autocomplete="off" value="${S.nome}"></div>
      <div class="campo"><label>Sua turma</label><div class="turmagrid" id="grTurma"></div></div>
    </div>`;
  const gr = document.getElementById("grTurma");
  CONT.turmas.forEach(t=>{
    const b = document.createElement("button");
    b.className = "turmabtn" + (S.turma===t?" sel":"");
    b.textContent = t;
    b.onclick = ()=>{ S.turma = t; conferir(); document.querySelectorAll(".turmabtn").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); };
    gr.appendChild(b);
  });
  const inp = document.getElementById("inNome");
  inp.oninput = conferir;
  function conferir(){ rbProx.disabled = !(inp.value.trim().length>1 && S.turma); }
  conferir();
  rbProx.onclick = ()=>{
    S.nome = inp.value.trim(); salvar();
    rbProx.onclick = proxima; rbVolta.onclick = voltar;
    irPara(0,-1,false);
  };
}

function telaMapa(){
  chips("cronograma");
  rbVolta.disabled = true; rbProx.disabled = true; rbProx.textContent = "Escolha uma aula";
  let cards = "";
  CONT.aulas.forEach(a=>{
    const feita = S.feitas["a"+a.n];
    const cls = a.status==="pronta" ? ("aulacard pronta"+(feita?" feita":"")) : "aulacard espera";
    const est = a.status==="pronta" ? (feita ? "você já terminou · pode refazer" : "pronta para começar") : "aguardando o material";
    cards += `<button class="${cls}" data-a="${a.n}" ${a.status!=="pronta"?"disabled":""}>
        <span class="num">Aula ${a.n} de 4</span>
        <div class="tit">${a.titulo}</div>
        <div class="sem">${a.semana}</div>
        <div class="est">${est}</div>
      </button>`;
  });
  palco.innerHTML = `
    <div class="card">
      <h1>Cronograma da Unidade 02</h1>
      <h2>${CONT.ano} · escolha por onde continuar</h2>
      <p>Você não precisa terminar tudo no mesmo dia. Este arquivo guarda no seu navegador em que aula você parou.</p>
      <div class="mapa">${cards}</div>
      <div class="lacuna">As aulas 02, 03 e 04 abrem assim que o material delas chegar.</div>
    </div>`;
  palco.querySelectorAll(".aulacard[data-a]").forEach(b=>{
    b.onclick = ()=>{ const n = +b.dataset.a; const t0 = CONT.aulas[n-1].telas[0]; irPara(n, 0, !!(t0&&t0.foco)); };
  });
}

function cabeca(t, a){
  return `<div class="chipsbox"><span class="chip">${t.card}</span><span class="chip">Aula ${a.n} · ${a.titulo}</span></div>`;
}

function telaObjetivos(t){
  const a = CONT.aulas[S.aula-1];
  let li = "";
  t.itens.forEach((x,i)=>{ li += `<li><span class="pin">${i+1}</span><span>${x}</span></li>`; });
  palco.innerHTML = `<div class="card">${cabeca(t,a)}
    <h1>O que vamos aprender</h1>
    <h2>Aula ${a.n} · ${a.titulo}</h2>
    <ul class="objlista">${li}</ul>
    <div class="nota">Habilidades da BNCC nesta aula: ${t.habilidades}</div>
    <div class="lacuna">Tela provisória. O motor definitivo das telas de objetivo é do nó de Objetivos e ainda não chegou aqui.</div>
  </div>`;
}

function telaTexto(t){
  const a = CONT.aulas[S.aula-1];
  palco.innerHTML = `<div class="card">${cabeca(t,a)}
    <h1>${t.titulo}</h1>${t.html}</div>`;
}

function telaPassos(t){
  const a = CONT.aulas[S.aula-1];
  let ps = "";
  t.passos.forEach((x,i)=>{ ps += `<div class="passo"><span class="passonum">${i+1}</span><span class="passotxt">${x}</span></div>`; });
  palco.innerHTML = `<div class="card">${cabeca(t,a)}
    <h1>${t.titulo}</h1>
    <p>${t.intro}</p>
    ${ps}
    ${t.codigo||""}
    ${t.nota?`<div class="nota">${t.nota}</div>`:""}
  </div>`;
}

function telaLacuna(t){
  const a = CONT.aulas[S.aula-1];
  const chave = "a"+S.aula+"t"+S.tela;
  const feito = S.resp[chave];
  let frases = "";
  t.frases.forEach((f,i)=>{
    frases += `<div class="lacunafrase">${f}<span class="slot vazio" data-s="${i}">_______</span>${t.fins[i]}</div>`;
  });
  let pal = "";
  t.palavras.forEach(p=>{ pal += `<button class="palavra" data-p="${p}">${p}</button>`; });
  palco.innerHTML = `<div class="card">${cabeca(t,a)}
    <h1>${t.titulo}</h1>
    <p>Leia as frases e clique nas palavras, na ordem que completa cada lacuna.</p>
    <div class="lacunas">${frases}</div>
    <div class="chipsbox" id="boxPal">${pal}</div>
    <button class="alt" id="btLimpa" style="max-width:220px;text-align:center;font-weight:800">Limpar respostas</button>
    <div id="fbLac"></div>
  </div>`;
  const slots = [...palco.querySelectorAll(".slot")];
  let posto = [];
  function pintar(){
    slots.forEach((s,i)=>{
      s.textContent = posto[i] || "_______";
      s.classList.toggle("vazio", !posto[i]);
    });
    palco.querySelectorAll(".palavra").forEach(b=>{ b.disabled = posto.includes(b.dataset.p); });
    if(posto.length === slots.length) conferir();
  }
  function conferir(){
    const ok = posto.every((p,i)=> p === t.certo[i]);
    S.resp[chave] = ok ? "ok" : "no"; salvar();
    document.getElementById("fbLac").innerHTML =
      `<div class="fb ${ok?"ok":"no"}">${ok ? "Sequência correta. " + t.fb : "Ainda não. Use o botão de limpar e tente de novo pensando em qual palavra completa cada frase."}</div>`;
  }
  palco.querySelectorAll(".palavra").forEach(b=>{
    b.onclick = ()=>{ if(posto.length < slots.length){ posto.push(b.dataset.p); pintar(); } };
  });
  document.getElementById("btLimpa").onclick = ()=>{ posto = []; document.getElementById("fbLac").innerHTML=""; pintar(); };
  if(feito==="ok"){ posto = t.certo.slice(); pintar(); } else { pintar(); }
}

function telaQuiz(t){
  const a = CONT.aulas[S.aula-1];
  const chave = "a"+S.aula+"t"+S.tela;
  let alts = "";
  t.alts.forEach((x,i)=>{ alts += `<button class="alt" data-i="${i}">${String.fromCharCode(65+i)}) ${x}</button>`; });
  palco.innerHTML = `<div class="card">${cabeca(t,a)}
    <h1>${t.card}</h1>
    ${t.enunciado}
    <div id="boxAlt">${alts}</div>
    <div id="fbQuiz"></div>
  </div>`;
  function responder(i){
    const ok = (i === t.certo);
    if(!S.resp[chave]) { S.resp[chave] = ok ? "ok" : "no"; S.esc[chave] = i; salvar(); }
    palco.querySelectorAll(".alt").forEach(b=>{
      b.disabled = true;
      const j = +b.dataset.i;
      if(j === t.certo) b.classList.add("certo");
      if(j === i && !ok) b.classList.add("errado");
    });
    document.getElementById("fbQuiz").innerHTML = `<div class="fb ${ok?"ok":"no"}">${t.fbs[i]}</div>`;
  }
  palco.querySelectorAll(".alt").forEach(b=>{ b.onclick = ()=> responder(+b.dataset.i); });
  if(S.resp[chave] !== undefined && S.esc[chave] !== undefined) responder(S.esc[chave]);
}

function telaPlacar(t){
  const a = CONT.aulas[S.aula-1];
  const total = a.telas.filter(x=>x.tipo==="quiz"||x.tipo==="lacuna").length;
  let acertos = 0;
  a.telas.forEach((x,i)=>{ if((x.tipo==="quiz"||x.tipo==="lacuna") && S.resp["a"+S.aula+"t"+i]==="ok") acertos++; });
  const pct = total ? Math.round(acertos*100/total) : 0;
  palco.innerHTML = `<div class="card placar">
    <h1>Placar da aula ${a.n}</h1>
    <div class="placarnum">${acertos} de ${total}</div>
    <div class="placarlab">atividades certas de primeira</div>
    <div class="barra"><div style="width:${pct}%"></div></div>
    <p>${S.nome} · ${S.turma}</p>
    <p>${acertos===total ? "Tudo certo. Mostre o projeto do mago ao professor." : "Volte nas atividades que ficaram em vermelho antes de mostrar o projeto ao professor."}</p>
    <div class="nota" style="text-align:left">Não esqueça de registrar as respostas na plataforma do Alura e de salvar seu projeto no StartLab.</div>
    <div class="rod">Faça como eu fiz · ${CONT.versao} · N.05.01.02.03_FACA-START-U02-A0104_004</div>
  </div>`;
}

/* ========================= INICIO ========================= */
carregar();
rbProx.onclick = proxima;
rbVolta.onclick = voltar;
desenhar();
</script>
</body>
</html>
